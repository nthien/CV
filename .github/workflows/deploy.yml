name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get repository name
        id: repo
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "Repository name: $REPO_NAME"

      - name: Set base path for build
        id: basepath
        run: |
          if [ "${{ secrets.USE_CUSTOM_DOMAIN }}" == "true" ]; then
            echo "basepath=" >> $GITHUB_OUTPUT
            echo "Using custom domain - basePath will be empty"
          elif [ -n "${{ secrets.NEXT_PUBLIC_BASE_PATH }}" ]; then
            echo "basepath=${{ secrets.NEXT_PUBLIC_BASE_PATH }}" >> $GITHUB_OUTPUT
            echo "Using custom basePath: ${{ secrets.NEXT_PUBLIC_BASE_PATH }}"
          else
            echo "basepath=/${{ steps.repo.outputs.name }}" >> $GITHUB_OUTPUT
            echo "Using default basePath: /${{ steps.repo.outputs.name }}"
          fi

      - name: Build
        env:
          # For custom domain: Add secret USE_CUSTOM_DOMAIN with value 'true'
          # For GitHub Pages subpath: Add secret NEXT_PUBLIC_BASE_PATH='/repo-name' or leave empty (will use /CV)
          USE_CUSTOM_DOMAIN: ${{ secrets.USE_CUSTOM_DOMAIN || 'false' }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.basepath }}
        run: npm run build

      - name: Create .nojekyll file
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

